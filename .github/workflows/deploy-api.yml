name: Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run validate:quiz-bank -w apps/api
      - run: node apps/api/scripts/curriculum/import-kicd-grade1-3.mjs --dry-run
      - run: node apps/api/scripts/curriculum/import-kicd-corpus.mjs --validate-only --grade-dir apps/api/data/curriculum/KEN/CBC/kicd-2024-grade-4 --grade-dir apps/api/data/curriculum/KEN/CBC/kicd-2024-grade-5
      - run: npm run test:api

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    concurrency:
      group: deploy-api-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.KITABU_DEPLOY_SSH_KEY }}" > ~/.ssh/kitabu_deploy
          chmod 600 ~/.ssh/kitabu_deploy
          printf '%s\n' "${{ secrets.KITABU_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Refuse deploy over production drift
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kitabu_deploy "${{ secrets.KITABU_DEPLOY_USER }}@${{ secrets.KITABU_DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/kitabu-ai
          if [ ! -d .git ]; then
            echo "::error::/opt/kitabu-ai is not a Git worktree; refusing rsync deploy."
            exit 1
          fi

          status="$(
            git status --porcelain --untracked-files=all |
              grep -Ev '^(\?\? | M |M  |A  | D |D  )(\.env|\.env\..*|apps/api/\.env|apps/api/\.env\..*)$' || true
          )"
          if [ -n "$status" ]; then
            echo "::error::Production tree has uncommitted or untracked changes. Commit/reconcile them before deploying."
            printf '%s\n' "$status" | sed -n '1,120p'
            exit 1
          fi
          REMOTE
      - name: Sync code to production host
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/kitabu_deploy" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --include '.env.example' \
            --include 'apps/api/.env.example' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'apps/api/.env' \
            --exclude 'apps/api/.env.*' \
            --exclude 'apps/api/data/books/' \
            --exclude '*.pem' \
            --exclude '.secrets' \
            --exclude 'smoke-email.txt' \
            ./ "${{ secrets.KITABU_DEPLOY_USER }}@${{ secrets.KITABU_DEPLOY_HOST }}:/opt/kitabu-ai/"
      - name: Mark production Git revision
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kitabu_deploy "${{ secrets.KITABU_DEPLOY_USER }}@${{ secrets.KITABU_DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/kitabu-ai
          git fetch origin '${{ github.ref_name }}'
          git reset --mixed '${{ github.sha }}'
          REMOTE
      - name: Deploy on Hetzner
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kitabu_deploy "${{ secrets.KITABU_DEPLOY_USER }}@${{ secrets.KITABU_DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/kitabu-ai
          docker compose config --quiet
          docker compose up -d postgres redis
          docker compose build api worker
          docker compose run --rm -T api node scripts/apply-migrations.mjs </dev/null
          docker compose run --rm -T api node scripts/curriculum/import-kicd-grade1-3.mjs --dry-run </dev/null
          docker compose run --rm -T api node scripts/curriculum/import-kicd-grade1-3.mjs </dev/null
          docker compose run --rm -T api node scripts/curriculum/import-kicd-corpus.mjs --grade-dir data/curriculum/KEN/CBC/kicd-2024-grade-4 --grade-dir data/curriculum/KEN/CBC/kicd-2024-grade-5 </dev/null
          docker compose run --rm -T api node scripts/quiz-bank/validate-quiz-bank.mjs </dev/null
          docker compose run --rm -T api node scripts/quiz-bank/import-quiz-bank.mjs </dev/null
          docker compose run --rm -T api node scripts/verify-production-readiness.mjs </dev/null
          docker compose up -d --force-recreate api worker caddy
          docker exec kitabu-caddy grep -q 'resetPasswordPath' /etc/caddy/Caddyfile
          docker exec kitabu-caddy grep -q 'verifyEmailPath' /etc/caddy/Caddyfile
          docker exec kitabu-caddy grep -q 'privacyPath' /etc/caddy/Caddyfile
          docker exec kitabu-caddy grep -q 'policyPath' /etc/caddy/Caddyfile
          docker exec kitabu-caddy grep -q 'termsPath' /etc/caddy/Caddyfile
          docker exec kitabu-caddy grep -q 'deletionPath' /etc/caddy/Caddyfile
          docker exec kitabu-api grep -q 'Reset link unavailable' /app/dist/server.js
          docker exec kitabu-api grep -q 'Open Kitabu AI Login' /app/dist/server.js
          docker exec kitabu-api test -s /app/legal/legal.css
          docker exec kitabu-api test -s /app/legal/assets/kitabu-icon-bold-192.png
          docker exec kitabu-api test -s /app/legal/assets/kitabu-favicon-bold.ico
          docker exec kitabu-api test -s /app/legal/assets/fonts/bricolage-grotesque-latin.woff2
          docker exec kitabu-api test -s /app/legal/assets/fonts/plus-jakarta-sans-latin.woff2
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              healthy=1
              break
            fi

            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            docker compose logs api --tail=120
            exit 1
          fi

          curl --fail --silent https://app.kitabu.ai/health >/dev/null
          curl --fail --silent 'https://app.kitabu.ai/reset-password?token=abcdefghijklmnopqrstuvwxyz123456' | grep -q 'Reset your password'
          curl --fail --silent 'https://app.kitabu.ai/reset-password?token=abcdefghijklmnopqrstuvwxyz123456' | grep -q '/auth/password/reset'
          curl --fail --silent --location 'https://kitabu.ai/reset-password?token=abcdefghijklmnopqrstuvwxyz123456' | grep -q 'Reset your password'
          curl --silent --show-error 'https://app.kitabu.ai/verify-email?token=abcdefghijklmnopqrstuvwxyz123456' | grep -q 'Verification failed'
          curl --silent --show-error --location 'https://kitabu.ai/verify-email?token=abcdefghijklmnopqrstuvwxyz123456' | grep -q 'Verification failed'
          assetlinks="$(curl --fail --silent https://app.kitabu.ai/.well-known/assetlinks.json)"
          printf '%s' "$assetlinks" | grep -q '"package_name":"ai.kitabu2.twa"'
          printf '%s' "$assetlinks" | grep -q 'BD:54:41:50:8D:76:20:01:52:09:67:D1:42:9A:7B:4C:C9:5C:35:05:5D:EF:A2:27:F4:2C:71:D6:B8:F2:B1:26'
          printf '%s' "$assetlinks" | grep -q 'delegate_permission/common.get_login_creds'
          assert_redirect() {
            source_url="$1"
            destination_url="$2"
            actual="$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' "$source_url")"
            if [ "$actual" != "308 $destination_url" ]; then
              echo "::error::$source_url returned '$actual'; expected '308 $destination_url'."
              exit 1
            fi
          }
          assert_redirect https://kitabu.ai/privacy https://app.kitabu.ai/privacy
          assert_redirect https://kitabu.ai/policy https://app.kitabu.ai/policy
          assert_redirect https://kitabu.ai/terms https://app.kitabu.ai/terms
          assert_redirect https://kitabu.ai/Terms https://app.kitabu.ai/terms
          assert_redirect https://kitabu.ai/TERMS https://app.kitabu.ai/terms
          assert_redirect https://kitabu.ai/deletion https://app.kitabu.ai/deletion
          curl --fail --silent --location https://kitabu.ai/privacy | grep -q 'Privacy & Cookie Policy'
          curl --fail --silent --location https://kitabu.ai/policy | grep -q 'Privacy & Cookie Policy'
          curl --fail --silent --location https://kitabu.ai/terms | grep -q 'General Terms and Conditions of Use'
          curl --fail --silent --location https://kitabu.ai/deletion | grep -q 'Account Deletion Request'
          curl --fail --silent 'https://app.kitabu.ai/policy?deploy=${{ github.sha }}' | grep -q 'https://app.kitabu.ai/deletion'
          curl --fail --silent 'https://app.kitabu.ai/legal.css?deploy=${{ github.sha }}' >/dev/null
          curl --fail --silent 'https://app.kitabu.ai/assets/kitabu-icon-bold-192.png?deploy=${{ github.sha }}' >/dev/null
          curl --fail --silent 'https://app.kitabu.ai/assets/kitabu-favicon-bold.ico?deploy=${{ github.sha }}' >/dev/null
          curl --fail --silent 'https://app.kitabu.ai/assets/fonts/bricolage-grotesque-latin.woff2?deploy=${{ github.sha }}' >/dev/null
          curl --fail --silent 'https://app.kitabu.ai/assets/fonts/plus-jakarta-sans-latin.woff2?deploy=${{ github.sha }}' >/dev/null
          curl --fail --silent 'https://kitabu.ai/?deploy=${{ github.sha }}' | grep -q 'https://kitabu.ai/favicon.svg'
          curl --fail --silent 'https://kitabu.ai/favicon.svg?deploy=${{ github.sha }}' | grep -q '#ffb11b'
          curl --fail --silent https://admin.kitabu.ai/app.js | grep -q '/curriculum/import/pdf'
          curl --fail --silent https://admin.kitabu.ai/app.js | grep -q '/ai/generate-text'
          curl --fail --silent 'https://admin.kitabu.ai/favicon.svg?deploy=${{ github.sha }}' | grep -q '#ffb11b'
          REMOTE
      - name: Remove deploy SSH key from runner
        if: always()
        run: rm -f ~/.ssh/kitabu_deploy
