name: Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    concurrency:
      group: deploy-api-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Allow this runner through Hetzner firewall
        env:
          KITABU_HCLOUD_TOKEN: ${{ secrets.KITABU_HCLOUD_TOKEN }}
          KITABU_FIREWALL_ID: ${{ secrets.KITABU_FIREWALL_ID }}
          KITABU_SETUP_SSH_CIDR: ${{ secrets.KITABU_SETUP_SSH_CIDR }}
        run: |
          set -euo pipefail
          hcloud_token="$(printf '%s' "${KITABU_HCLOUD_TOKEN}" | tr -d '\r\n')"
          firewall_id="$(printf '%s' "${KITABU_FIREWALL_ID}" | tr -d '\r\n')"
          setup_ssh_cidr="$(printf '%s' "${KITABU_SETUP_SSH_CIDR}" | tr -d '\r\n')"
          runner_ip="$(curl -fsS https://api.ipify.org)"
          cat > /tmp/kitabu-firewall-open.json <<JSON
          {
            "rules": [
              {
                "direction": "in",
                "protocol": "tcp",
                "port": "22",
                "source_ips": ["${setup_ssh_cidr}", "${runner_ip}/32"],
                "description": "SSH from setup workstation and active GitHub deploy runner"
              }
            ]
          }
          JSON
          action_id="$(
            curl -fsS -X POST \
              -H "Authorization: Bearer ${hcloud_token}" \
              -H "Content-Type: application/json" \
              -d @/tmp/kitabu-firewall-open.json \
              "https://api.hetzner.cloud/v1/firewalls/${firewall_id}/actions/set_rules" |
              jq -r '.action.id'
          )"
          for attempt in $(seq 1 30); do
            status="$(
              curl -fsS \
                -H "Authorization: Bearer ${hcloud_token}" \
                "https://api.hetzner.cloud/v1/actions/${action_id}" |
                jq -r '.action.status'
            )"
            [ "$status" = "success" ] && exit 0
            [ "$status" = "error" ] && exit 1
            sleep 1
          done
          exit 1
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.KITABU_DEPLOY_SSH_KEY }}" > ~/.ssh/kitabu_deploy
          chmod 600 ~/.ssh/kitabu_deploy
          printf '%s\n' "${{ secrets.KITABU_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Sync code to production host
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/kitabu_deploy" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'apps/api/.env' \
            --exclude '.secrets' \
            ./ "${{ secrets.KITABU_DEPLOY_USER }}@${{ secrets.KITABU_DEPLOY_HOST }}:/opt/kitabu-ai/"
      - name: Deploy on Hetzner
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kitabu_deploy "${{ secrets.KITABU_DEPLOY_USER }}@${{ secrets.KITABU_DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          cd /opt/kitabu-ai
          docker compose up -d postgres redis
          docker compose build api worker
          docker compose run --rm api node scripts/apply-migrations.mjs
          docker compose run --rm api node scripts/verify-production-readiness.mjs
          docker compose up -d api worker caddy
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              healthy=1
              break
            fi

            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            docker compose logs api --tail=120
            exit 1
          fi

          curl --fail --silent https://app.kitabu.ai/health >/dev/null
          curl --fail --silent https://kitabu.ai/deletion | grep -q 'Account Deletion Request'
          curl --fail --silent https://admin.kitabu.ai/app.js | grep -q '/curriculum/import/pdf'
          curl --fail --silent https://admin.kitabu.ai/app.js | grep -q '/ai/generate-text'
          REMOTE
      - name: Restore Hetzner firewall
        if: always()
        env:
          KITABU_HCLOUD_TOKEN: ${{ secrets.KITABU_HCLOUD_TOKEN }}
          KITABU_FIREWALL_ID: ${{ secrets.KITABU_FIREWALL_ID }}
          KITABU_SETUP_SSH_CIDR: ${{ secrets.KITABU_SETUP_SSH_CIDR }}
        run: |
          set -euo pipefail
          hcloud_token="$(printf '%s' "${KITABU_HCLOUD_TOKEN}" | tr -d '\r\n')"
          firewall_id="$(printf '%s' "${KITABU_FIREWALL_ID}" | tr -d '\r\n')"
          setup_ssh_cidr="$(printf '%s' "${KITABU_SETUP_SSH_CIDR}" | tr -d '\r\n')"
          cat > /tmp/kitabu-firewall-restore.json <<JSON
          {
            "rules": [
              {
                "direction": "in",
                "protocol": "tcp",
                "port": "22",
                "source_ips": ["${setup_ssh_cidr}"],
                "description": "SSH from setup workstation"
              }
            ]
          }
          JSON
          curl -fsS -X POST \
            -H "Authorization: Bearer ${hcloud_token}" \
            -H "Content-Type: application/json" \
            -d @/tmp/kitabu-firewall-restore.json \
            "https://api.hetzner.cloud/v1/firewalls/${firewall_id}/actions/set_rules" >/dev/null
