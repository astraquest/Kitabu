name: Deploy API

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run validate:quiz-bank -w apps/api
      - run: node apps/api/scripts/curriculum/import-kicd-grade1-3.mjs --dry-run
      - run: node apps/api/scripts/curriculum/import-kicd-corpus.mjs --validate-only --grade-dir apps/api/data/curriculum/KEN/CBC/kicd-2024-grade-4 --grade-dir apps/api/data/curriculum/KEN/CBC/kicd-2024-grade-5 --grade-dir apps/api/data/curriculum/KEN/CBC/kicd-2024-grade-6 --grade-dir apps/api/data/curriculum/KEN/CBC/kicd-2024-grade-7 --grade-dir apps/api/data/curriculum/KEN/CBC/kicd-2024-grade-8 --grade-dir apps/api/data/curriculum/KEN/CBC/kicd-2024-grade-9
      - run: node apps/api/scripts/curriculum/import-kicd-corpus.mjs --validate-only --grade-dir apps/api/data/curriculum/KEN/CBC/kicd-2025-grade-10
      - run: node apps/api/scripts/curriculum/import-kicd-corpus.mjs --validate-only --grade-dir apps/api/data/curriculum/KEN/CBC/kicd-2025-grade-11
      - run: node apps/api/scripts/curriculum/import-kicd-corpus.mjs --validate-only --grade-dir apps/api/data/curriculum/KEN/CBC/kicd-2026-grade-12
      - run: npm run test:api

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    concurrency:
      group: kitabu-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.KITABU_DEPLOY_SSH_KEY }}" > ~/.ssh/kitabu_deploy
          chmod 600 ~/.ssh/kitabu_deploy
          printf '%s\n' "${{ secrets.KITABU_DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Refuse deploy over production drift
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kitabu_deploy "${{ secrets.KITABU_DEPLOY_USER }}@${{ secrets.KITABU_DEPLOY_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/kitabu-ai
          if [ ! -d .git ]; then
            echo "::error::/opt/kitabu-ai is not a Git worktree; refusing rsync deploy."
            exit 1
          fi

          status="$(
            git status --porcelain --untracked-files=all |
              grep -Ev '^(\?\? | M |M  |A  | D |D  )(\.env|\.env\..*|apps/api/\.env|apps/api/\.env\..*)$' || true
          )"
          if [ -n "$status" ]; then
            echo "::error::Production tree has uncommitted or untracked changes. Commit/reconcile them before deploying."
            printf '%s\n' "$status" | sed -n '1,120p'
            exit 1
          fi
          REMOTE
      - name: Sync immutable release to production staging
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/kitabu_deploy" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --include '.env.example' \
            --include 'apps/api/.env.example' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'apps/api/.env' \
            --exclude 'apps/api/.env.*' \
            --exclude 'apps/api/data/books/' \
            --exclude 'apps/api/data/reference-library/' \
            --exclude '*.pem' \
            --exclude '.secrets' \
            --exclude 'smoke-email.txt' \
            ./ "${{ secrets.KITABU_DEPLOY_USER }}@${{ secrets.KITABU_DEPLOY_HOST }}:/tmp/kitabu-release-${{ github.sha }}/"
      - name: Deploy on Hetzner
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kitabu_deploy "${{ secrets.KITABU_DEPLOY_USER }}@${{ secrets.KITABU_DEPLOY_HOST }}" \
            'flock -w 1800 /tmp/kitabu-api-production.lock bash -se' <<'REMOTE'
          set -euo pipefail
          release_stage='/tmp/kitabu-release-${{ github.sha }}'
          case "$release_stage" in
            /tmp/kitabu-release-[0-9a-f][0-9a-f]*) ;;
            *) echo "::error::Invalid immutable release staging path."; exit 1 ;;
          esac
          if [ ! -d "$release_stage" ]; then
            echo "::error::Immutable release staging directory is missing."
            exit 1
          fi
          cleanup_release_stage() {
            rm -rf -- "$release_stage"
          }
          trap cleanup_release_stage EXIT

          cd /opt/kitabu-ai
          status="$(
            git status --porcelain --untracked-files=all |
              grep -Ev '^(\?\? | M |M  |A  | D |D  )(\.env|\.env\..*|apps/api/\.env|apps/api/\.env\..*)$' || true
          )"
          if [ -n "$status" ]; then
            echo "::error::Production tree changed after preflight. Refusing staged activation."
            printf '%s\n' "$status" | sed -n '1,120p'
            exit 1
          fi
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --include '.env.example' \
            --include 'apps/api/.env.example' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'apps/api/.env' \
            --exclude 'apps/api/.env.*' \
            --exclude 'apps/api/data/books/' \
            --exclude 'apps/api/data/reference-library/' \
            --exclude '*.pem' \
            --exclude '.secrets' \
            --exclude 'smoke-email.txt' \
            "$release_stage/" /opt/kitabu-ai/
          git fetch origin '${{ github.ref_name }}'
          git reset --mixed '${{ github.sha }}'
          install -d -m 750 apps/api/data/reference-library
          docker compose config --quiet
          docker compose up -d postgres redis
          docker compose build api worker

          data_plan="$(
            docker compose run --rm -T \
              -e KITABU_RELEASE_SHA='${{ github.sha }}' \
              api node scripts/deployment/run-data-operations.mjs --plan </dev/null
          )"
          printf '%s\n' "$data_plan"
          data_mutates=false
          if grep -q '"mutatesData":true' <<<"$data_plan"; then
            data_mutates=true
            data_apply_guard=''
            pre_backup="$(
              KITABU_BACKUP_DIR=/var/backups/kitabu \
              KITABU_COMPOSE_DIR=/opt/kitabu-ai \
              ./infra/backup.sh
            )"
            echo "KITABU_PRE_DEPLOY_BACKUP:$pre_backup"
          else
            data_apply_guard='--require-no-mutations'
            echo 'KITABU_DATA_BACKUP_SKIPPED:no-pending-data-mutations'
          fi

          docker compose run --rm -T api node scripts/apply-migrations.mjs </dev/null
          docker compose run --rm -T \
            -e KITABU_RELEASE_SHA='${{ github.sha }}' \
            -e KITABU_DATA_OPERATION_MEMORY_BUDGET_MIB=900 \
            -e NODE_OPTIONS=--max-old-space-size=640 \
            api node scripts/deployment/run-data-operations.mjs --apply $data_apply_guard </dev/null
          docker compose run --rm -T \
            -e KITABU_NODE_ENV=production \
            -e KITABU_RELEASE_VERSION='${{ github.ref_name }}' \
            -e KITABU_RELEASE_SHA='${{ github.sha }}' \
            api node scripts/verify-production-readiness.mjs </dev/null
          KITABU_RELEASE_VERSION='${{ github.ref_name }}' \
          KITABU_RELEASE_SHA='${{ github.sha }}' \
          docker compose up -d --force-recreate api worker caddy
          docker exec kitabu-caddy grep -q 'resetPasswordPath' /etc/caddy/Caddyfile
          docker exec kitabu-caddy grep -q 'verifyEmailPath' /etc/caddy/Caddyfile
          docker exec kitabu-caddy grep -q 'privacyPath' /etc/caddy/Caddyfile
          docker exec kitabu-caddy grep -q 'policyPath' /etc/caddy/Caddyfile
          docker exec kitabu-caddy grep -q 'termsPath' /etc/caddy/Caddyfile
          docker exec kitabu-caddy grep -q 'deletionPath' /etc/caddy/Caddyfile
          docker exec kitabu-api grep -q 'Reset link unavailable' /app/dist/server.js
          docker exec kitabu-api grep -q 'Open Kitabu AI Login' /app/dist/server.js
          docker exec kitabu-api test -s /app/legal/legal.css
          docker exec kitabu-api test -s /app/legal/assets/kitabu-icon-bold-192.png
          docker exec kitabu-api test -s /app/legal/assets/kitabu-favicon-bold.ico
          docker exec kitabu-api test -s /app/legal/assets/fonts/bricolage-grotesque-latin.woff2
          docker exec kitabu-api test -s /app/legal/assets/fonts/plus-jakarta-sans-latin.woff2
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile </dev/null
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              healthy=1
              break
            fi

            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            docker compose logs api --tail=120
            exit 1
          fi

          assert_url_contains() {
            local source_url="$1"
            local expected="$2"
            local body
            shift 2
            body="$(curl "$@" "$source_url")"
            if ! grep -Fq -- "$expected" <<<"$body"; then
              echo "::error::$source_url did not contain the expected deployment marker."
              return 1
            fi
          }

          curl --fail --silent https://app.kitabu.ai/health >/dev/null
          assert_url_contains 'https://app.kitabu.ai/reset-password?token=abcdefghijklmnopqrstuvwxyz123456' 'Reset your password' --fail --silent --show-error
          assert_url_contains 'https://app.kitabu.ai/reset-password?token=abcdefghijklmnopqrstuvwxyz123456' '/auth/password/reset' --fail --silent --show-error
          assert_url_contains 'https://kitabu.ai/reset-password?token=abcdefghijklmnopqrstuvwxyz123456' 'Reset your password' --fail --silent --show-error --location
          assert_url_contains 'https://app.kitabu.ai/verify-email?token=abcdefghijklmnopqrstuvwxyz123456' 'Verification failed' --silent --show-error
          assert_url_contains 'https://kitabu.ai/verify-email?token=abcdefghijklmnopqrstuvwxyz123456' 'Verification failed' --silent --show-error --location
          assetlinks="$(curl --fail --silent https://app.kitabu.ai/.well-known/assetlinks.json)"
          grep -Fq '"package_name":"ai.kitabu2.twa"' <<<"$assetlinks"
          grep -Fq 'BD:54:41:50:8D:76:20:01:52:09:67:D1:42:9A:7B:4C:C9:5C:35:05:5D:EF:A2:27:F4:2C:71:D6:B8:F2:B1:26' <<<"$assetlinks"
          grep -Fq 'delegate_permission/common.get_login_creds' <<<"$assetlinks"
          assert_redirect() {
            source_url="$1"
            destination_url="$2"
            actual="$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{redirect_url}' "$source_url")"
            if [ "$actual" != "308 $destination_url" ]; then
              echo "::error::$source_url returned '$actual'; expected '308 $destination_url'."
              exit 1
            fi
          }
          assert_redirect https://kitabu.ai/privacy https://app.kitabu.ai/privacy
          assert_redirect https://kitabu.ai/policy https://app.kitabu.ai/policy
          assert_redirect https://kitabu.ai/terms https://app.kitabu.ai/terms
          assert_redirect https://kitabu.ai/Terms https://app.kitabu.ai/terms
          assert_redirect https://kitabu.ai/TERMS https://app.kitabu.ai/terms
          assert_redirect https://kitabu.ai/deletion https://app.kitabu.ai/deletion
          assert_url_contains https://kitabu.ai/privacy 'Privacy & Cookie Policy' --fail --silent --show-error --location
          assert_url_contains https://kitabu.ai/policy 'Privacy & Cookie Policy' --fail --silent --show-error --location
          assert_url_contains https://kitabu.ai/terms 'General Terms and Conditions of Use' --fail --silent --show-error --location
          assert_url_contains https://kitabu.ai/deletion 'Account Deletion Request' --fail --silent --show-error --location
          assert_url_contains 'https://app.kitabu.ai/policy?deploy=${{ github.sha }}' 'https://app.kitabu.ai/deletion' --fail --silent --show-error
          curl --fail --silent 'https://app.kitabu.ai/legal.css?deploy=${{ github.sha }}' >/dev/null
          curl --fail --silent 'https://app.kitabu.ai/assets/kitabu-icon-bold-192.png?deploy=${{ github.sha }}' >/dev/null
          curl --fail --silent 'https://app.kitabu.ai/assets/kitabu-favicon-bold.ico?deploy=${{ github.sha }}' >/dev/null
          curl --fail --silent 'https://app.kitabu.ai/assets/fonts/bricolage-grotesque-latin.woff2?deploy=${{ github.sha }}' >/dev/null
          curl --fail --silent 'https://app.kitabu.ai/assets/fonts/plus-jakarta-sans-latin.woff2?deploy=${{ github.sha }}' >/dev/null
          assert_url_contains 'https://kitabu.ai/?deploy=${{ github.sha }}' 'https://kitabu.ai/favicon.svg' --fail --silent --show-error
          assert_url_contains 'https://kitabu.ai/favicon.svg?deploy=${{ github.sha }}' '#ffb11b' --fail --silent --show-error
          assert_url_contains https://admin.kitabu.ai/app.js '/curriculum/import/pdf' --fail --silent --show-error
          assert_url_contains https://admin.kitabu.ai/app.js '/ai/generate-text' --fail --silent --show-error
          assert_url_contains 'https://admin.kitabu.ai/favicon.svg?deploy=${{ github.sha }}' '#ffb11b' --fail --silent --show-error
          if [ "$data_mutates" = true ]; then
            post_backup="$(
              KITABU_BACKUP_DIR=/var/backups/kitabu \
              KITABU_COMPOSE_DIR=/opt/kitabu-ai \
              ./infra/backup.sh
            )"
            echo "KITABU_POST_DEPLOY_BACKUP:$post_backup"
          fi
          echo 'KITABU_DEPLOYMENT_COMPLETE:${{ github.sha }}'
          REMOTE
      - name: Remove deploy SSH key from runner
        if: always()
        run: rm -f ~/.ssh/kitabu_deploy
