services:
  postgres:
    image: postgres:16-alpine
    container_name: kitabu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitabu
      POSTGRES_PASSWORD: ${KITABU_POSTGRES_PASSWORD:?Set KITABU_POSTGRES_PASSWORD}
      POSTGRES_DB: kitabu_api
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"

  redis:
    image: redis:7-alpine
    container_name: kitabu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kitabu-api
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - ./apps/api/.env
    environment:
      KITABU_RELEASE_VERSION: ${KITABU_RELEASE_VERSION:-unknown}
      KITABU_RELEASE_SHA: ${KITABU_RELEASE_SHA:-unknown}
    volumes:
      - ./apps/api/data/books:/app/data/books:ro
      - ./apps/api/media/podcasts:/app/media/podcasts:ro
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:4000:4000"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kitabu-worker
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      KITABU_RELEASE_VERSION: ${KITABU_RELEASE_VERSION:-unknown}
      KITABU_RELEASE_SHA: ${KITABU_RELEASE_SHA:-unknown}
    volumes:
      - ./apps/api/data/books:/app/data/books:ro
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true
    depends_on:
      - postgres
      - redis

  caddy:
    image: caddy:2.8-alpine
    container_name: kitabu-caddy
    restart: unless-stopped
    depends_on:
      - api
    network_mode: host
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web:/srv/www:ro
      - ./apps/admin-web:/srv/admin:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
