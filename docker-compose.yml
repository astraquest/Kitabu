services:
  postgres:
    image: postgres:16-alpine
    container_name: kitabu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitabu
      POSTGRES_PASSWORD: ${KITABU_POSTGRES_PASSWORD:?Set KITABU_POSTGRES_PASSWORD}
      POSTGRES_DB: kitabu_api
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitabu -d kitabu_api"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "127.0.0.1:55432:5432"

  redis:
    image: redis:7-alpine
    container_name: kitabu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kitabu-api
    restart: unless-stopped
    mem_limit: 1g
    env_file:
      - ./apps/api/.env
    environment:
      KITABU_RELEASE_VERSION: ${KITABU_RELEASE_VERSION:-unknown}
      KITABU_RELEASE_SHA: ${KITABU_RELEASE_SHA:-unknown}
    volumes:
      - ./apps/api/data/books:/app/data/books:ro
      - ./apps/api/data/reference-library:/app/data/reference-library:ro
      - ./apps/api/media/podcasts:/app/media/podcasts:ro
      - tts-audio:/app/var/tts-audio
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:4000:4000"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kitabu-worker
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      KITABU_RELEASE_VERSION: ${KITABU_RELEASE_VERSION:-unknown}
      KITABU_RELEASE_SHA: ${KITABU_RELEASE_SHA:-unknown}
    volumes:
      - ./apps/api/data/books:/app/data/books:ro
      - ./apps/api/data/reference-library:/app/data/reference-library:ro
      - tts-audio:/app/var/tts-audio
    command: ["node", "dist/worker.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\""]
      interval: 60s
      timeout: 10s
      retries: 3
    depends_on:
      - postgres
      - redis

  caddy:
    image: caddy:2.8-alpine
    container_name: kitabu-caddy
    restart: unless-stopped
    depends_on:
      - api
    network_mode: host
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web:/srv/www:ro
      - ./apps/admin-web:/srv/admin:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  tts-audio:
    name: kitabu-ai_tts-audio
