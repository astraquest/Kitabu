apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

import java.util.Properties
import com.android.build.api.instrumentation.AsmClassVisitorFactory
import com.android.build.api.instrumentation.ClassContext
import com.android.build.api.instrumentation.ClassData
import com.android.build.api.instrumentation.FramesComputationMode
import com.android.build.api.instrumentation.InstrumentationParameters
import com.android.build.api.instrumentation.InstrumentationScope
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes

abstract class RemoveDeprecatedSystemBarApisFactory implements AsmClassVisitorFactory<InstrumentationParameters.None> {
    @Override
    boolean isInstrumentable(ClassData classData) {
        return isSupportedClassName(classData.className)
    }

    static boolean isSupportedClassName(String className) {
        return className.startsWith("com.facebook.react.modules.statusbar.StatusBarModule") ||
            className.startsWith("com.facebook.react.views.view.WindowUtilKt") ||
            className.startsWith("expo.modules.imagepicker.ExpoCropImage") ||
            className == "com.google.android.material.datepicker.MaterialDatePicker" ||
            className == "com.google.android.material.internal.EdgeToEdgeUtils" ||
            className == "com.google.android.material.datepicker.k" ||
            className == "androidx.lifecycle.ReportFragment"
    }

    static boolean isDeprecatedWindowMethod(String owner, String methodName, String methodDescriptor) {
        return owner == "android/view/Window" &&
            ((methodName == "getStatusBarColor" && methodDescriptor == "()I") ||
                ((methodName == "setStatusBarColor" || methodName == "setNavigationBarColor") &&
                    methodDescriptor == "(I)V"))
    }

    static boolean isDeprecatedCutoutField(int opcode, String owner, String fieldName, String fieldDescriptor) {
        return opcode == Opcodes.PUTFIELD &&
            owner == "android/view/WindowManager\$LayoutParams" &&
            fieldName == "layoutInDisplayCutoutMode" &&
            fieldDescriptor == "I"
    }

    @Override
    ClassVisitor createClassVisitor(ClassContext classContext, ClassVisitor nextClassVisitor) {
        return createTransformingClassVisitor(nextClassVisitor)
    }

    static ClassVisitor createTransformingClassVisitor(ClassVisitor nextClassVisitor) {
        return new ClassVisitor(Opcodes.ASM9, nextClassVisitor) {
            @Override
            MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                def nextMethodVisitor = super.visitMethod(access, name, descriptor, signature, exceptions)
                return new MethodVisitor(Opcodes.ASM9, nextMethodVisitor) {
                    @Override
                    void visitMethodInsn(int opcode, String owner, String methodName, String methodDescriptor, boolean isInterface) {
                        if (isDeprecatedWindowMethod(owner, methodName, methodDescriptor)) {
                            if (methodName == "getStatusBarColor") {
                                super.visitInsn(Opcodes.POP)
                                super.visitInsn(Opcodes.ICONST_0)
                            } else {
                                super.visitInsn(Opcodes.POP2)
                            }
                            return
                        }
                        super.visitMethodInsn(opcode, owner, methodName, methodDescriptor, isInterface)
                    }

                    @Override
                    void visitFieldInsn(int opcode, String owner, String fieldName, String fieldDescriptor) {
                        if (isDeprecatedCutoutField(opcode, owner, fieldName, fieldDescriptor)) {
                            super.visitInsn(Opcodes.POP2)
                            return
                        }
                        super.visitFieldInsn(opcode, owner, fieldName, fieldDescriptor)
                    }
                }
            }
        }
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def googleWebClientId = (project.findProperty("KITABU_GOOGLE_WEB_CLIENT_ID") ?: System.getenv("KITABU_GOOGLE_WEB_CLIENT_ID") ?: "").toString()
def googleAndroidClientId = (project.findProperty("KITABU_GOOGLE_ANDROID_CLIENT_ID") ?: System.getenv("KITABU_GOOGLE_ANDROID_CLIENT_ID") ?: "").toString()
def releasedAndroidVersionCodeFloor = 127L
def minimumAndroidVersionCode = releasedAndroidVersionCodeFloor + 1L
def googlePlayMaximumVersionCode = 2100000000L
def configuredAndroidVersionCode = project.findProperty("KITABU_ANDROID_VERSION_CODE") ?: System.getenv("KITABU_ANDROID_VERSION_CODE")
def resolveAndroidVersionCode = { configuredValue ->
    def resolvedVersionCode = minimumAndroidVersionCode
    if (configuredValue != null && configuredValue.toString().trim()) {
        def overrideText = configuredValue.toString().trim()
        if (!(overrideText ==~ /\d+/)) {
            throw new GradleException("KITABU_ANDROID_VERSION_CODE must be a whole number.")
        }
        try {
            resolvedVersionCode = Long.parseLong(overrideText)
        } catch (NumberFormatException exception) {
            throw new GradleException("KITABU_ANDROID_VERSION_CODE is outside the supported numeric range.", exception)
        }
        if (resolvedVersionCode < minimumAndroidVersionCode) {
            throw new GradleException("KITABU_ANDROID_VERSION_CODE must be at least ${minimumAndroidVersionCode}.")
        }
    }
    if (resolvedVersionCode > googlePlayMaximumVersionCode) {
        throw new GradleException("Resolved Android versionCode ${resolvedVersionCode} exceeds Google Play's maximum of ${googlePlayMaximumVersionCode}.")
    }
    return resolvedVersionCode as int
}

tasks.register("verifyAndroidVersionCodeResolver") {
    doLast {
        assert resolveAndroidVersionCode(null) == minimumAndroidVersionCode
        assert resolveAndroidVersionCode("128") == 128
        assert resolveAndroidVersionCode("129") == 129
        try {
            resolveAndroidVersionCode("127")
            assert false: "A stale versionCode override should be rejected"
        } catch (GradleException expected) {
            assert expected.message.contains("at least 128")
        }
        try {
            resolveAndroidVersionCode((googlePlayMaximumVersionCode + 1L).toString())
            assert false: "An out-of-range versionCode override should be rejected"
        } catch (GradleException expected) {
            assert expected.message.contains("exceeds Google Play's maximum")
        }
        println("Android versionCode resolver assertions passed")
    }
}

tasks.register("verifyDeprecatedSystemBarTransform") {
    doLast {
        assert RemoveDeprecatedSystemBarApisFactory.isSupportedClassName("com.google.android.material.datepicker.k")
        assert RemoveDeprecatedSystemBarApisFactory.isSupportedClassName("com.google.android.material.datepicker.MaterialDatePicker")
        assert RemoveDeprecatedSystemBarApisFactory.isSupportedClassName("com.google.android.material.internal.EdgeToEdgeUtils")
        assert RemoveDeprecatedSystemBarApisFactory.isSupportedClassName("androidx.lifecycle.ReportFragment")
        assert !RemoveDeprecatedSystemBarApisFactory.isSupportedClassName("androidx.lifecycle.SomeOtherFragment")
        assert RemoveDeprecatedSystemBarApisFactory.isDeprecatedWindowMethod(
            "android/view/Window", "getStatusBarColor", "()I"
        )
        assert RemoveDeprecatedSystemBarApisFactory.isDeprecatedWindowMethod(
            "android/view/Window", "setNavigationBarColor", "(I)V"
        )
        assert RemoveDeprecatedSystemBarApisFactory.isDeprecatedCutoutField(
            Opcodes.PUTFIELD, "android/view/WindowManager\$LayoutParams", "layoutInDisplayCutoutMode", "I"
        )

        def input = new org.objectweb.asm.ClassWriter(org.objectweb.asm.ClassWriter.COMPUTE_MAXS)
        input.visit(org.objectweb.asm.Opcodes.V1_8, org.objectweb.asm.Opcodes.ACC_PUBLIC, "test/SystemBarCalls", null, "java/lang/Object", null)
        def method = input.visitMethod(
            org.objectweb.asm.Opcodes.ACC_PUBLIC | org.objectweb.asm.Opcodes.ACC_STATIC,
            "calls",
            "(Landroid/view/Window;Landroid/view/WindowManager\$LayoutParams;)V",
            null,
            null
        )
        method.visitCode()
        method.visitVarInsn(org.objectweb.asm.Opcodes.ALOAD, 0)
        method.visitMethodInsn(org.objectweb.asm.Opcodes.INVOKEVIRTUAL, "android/view/Window", "getStatusBarColor", "()I", false)
        method.visitInsn(org.objectweb.asm.Opcodes.POP)
        method.visitVarInsn(org.objectweb.asm.Opcodes.ALOAD, 0)
        method.visitInsn(org.objectweb.asm.Opcodes.ICONST_1)
        method.visitMethodInsn(org.objectweb.asm.Opcodes.INVOKEVIRTUAL, "android/view/Window", "setStatusBarColor", "(I)V", false)
        method.visitVarInsn(org.objectweb.asm.Opcodes.ALOAD, 0)
        method.visitInsn(org.objectweb.asm.Opcodes.ICONST_2)
        method.visitMethodInsn(org.objectweb.asm.Opcodes.INVOKEVIRTUAL, "android/view/Window", "setNavigationBarColor", "(I)V", false)
        method.visitVarInsn(org.objectweb.asm.Opcodes.ALOAD, 1)
        method.visitInsn(org.objectweb.asm.Opcodes.ICONST_3)
        method.visitFieldInsn(org.objectweb.asm.Opcodes.PUTFIELD, "android/view/WindowManager\$LayoutParams", "layoutInDisplayCutoutMode", "I")
        method.visitInsn(org.objectweb.asm.Opcodes.RETURN)
        method.visitMaxs(2, 2)
        method.visitEnd()
        input.visitEnd()

        def output = new org.objectweb.asm.ClassWriter(org.objectweb.asm.ClassWriter.COMPUTE_MAXS)
        new org.objectweb.asm.ClassReader(input.toByteArray()).accept(
            RemoveDeprecatedSystemBarApisFactory.createTransformingClassVisitor(output),
            0
        )
        def remainingCalls = []
        def remainingFields = []
        new org.objectweb.asm.ClassReader(output.toByteArray()).accept(new ClassVisitor(Opcodes.ASM9) {
            @Override
            MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                def next = super.visitMethod(access, name, descriptor, signature, exceptions)
                return new MethodVisitor(Opcodes.ASM9, next) {
                    @Override
                    void visitMethodInsn(int opcode, String owner, String methodName, String methodDescriptor, boolean isInterface) {
                        remainingCalls << [owner, methodName, methodDescriptor]
                    }

                    @Override
                    void visitFieldInsn(int opcode, String owner, String fieldName, String fieldDescriptor) {
                        remainingFields << [opcode, owner, fieldName, fieldDescriptor]
                    }
                }
            }
        }, 0)
        assert remainingCalls.isEmpty(): "Deprecated Window method calls survived: ${remainingCalls}"
        assert remainingFields.isEmpty(): "Deprecated cutout field writes survived: ${remainingFields}"
        println("Deprecated system-bar transform matching and bytecode assertions passed")
    }
}
def resolvedAndroidVersionCode = resolveAndroidVersionCode(configuredAndroidVersionCode)
gradle.taskGraph.whenReady { graph ->
    def hasReleaseTask = graph.allTasks.any { task -> task.name.toLowerCase().contains("release") }
    if (hasReleaseTask && googleWebClientId.trim().isEmpty()) {
        throw new GradleException("KITABU_GOOGLE_WEB_CLIENT_ID must be configured for release builds.")
    }
    if (hasReleaseTask && googleAndroidClientId.trim().isEmpty()) {
        throw new GradleException("KITABU_GOOGLE_ANDROID_CLIENT_ID must be configured for release builds.")
    }
}
tasks.register("printReleaseVersionCode") {
    doLast {
        println("resolvedAndroidVersionCode=${resolvedAndroidVersionCode}")
    }
}
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.kitabunativeapp"
    defaultConfig {
        applicationId "ai.kitabu2.twa"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play has already used 127; the next explicitly gated release defaults to 128.
        versionCode resolvedAndroidVersionCode
        versionName "1.2.8"
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_OBJECT_PATH_MAX=128"
            }
        }
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${googleWebClientId.replace('\\', '\\\\').replace('"', '\\"')}\""
        buildConfigField "String", "GOOGLE_ANDROID_CLIENT_ID", "\"${googleAndroidClientId.replace('\\', '\\\\').replace('"', '\\"')}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.instrumentation.transformClassesWith(
            RemoveDeprecatedSystemBarApisFactory,
            InstrumentationScope.ALL
        ) {}
        variant.instrumentation.setAsmFramesComputationMode(
            FramesComputationMode.COMPUTE_FRAMES_FOR_INSTRUMENTED_METHODS
        )
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
