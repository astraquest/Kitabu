import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    includeBuild("../node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
}
plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}
expoAutolinking.projectRoot = file("..")
expoAutolinking.useExpoModules()
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven { url = uri("../node_modules/@react-native-async-storage/async-storage/android/local_repo") }
        google()
        mavenCentral()
    }
}
rootProject.name = 'KitabuNativeApp'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
